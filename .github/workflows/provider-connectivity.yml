name: Verify provider connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check live provider response
        run: python scripts/check_provider_connection.py
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install standard browser
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Check provider with Chromium
        run: python scripts/check_browser_connection.py
