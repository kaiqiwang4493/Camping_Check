name: Monitor Yosemite Camping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: yosemite-camping-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e .

      - name: Run monitor
        env:
          CLICKSEND_USERNAME: ${{ secrets.CLICKSEND_USERNAME }}
          CLICKSEND_API_KEY: ${{ secrets.CLICKSEND_API_KEY }}
          PHONE_TO: ${{ secrets.PHONE_TO }}
          PHONE_FROM: ${{ secrets.PHONE_FROM }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESERVE_CALIFORNIA_CAMPGROUNDS_JSON: ${{ vars.RESERVE_CALIFORNIA_CAMPGROUNDS_JSON }}
          CAMPGROUND_LIST: ${{ vars.CAMPGROUND_LIST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          YOSEMITE_SCAN_MONTHS: ${{ vars.YOSEMITE_SCAN_MONTHS }}
          MORRO_BAY_SCAN_MONTHS: ${{ vars.MORRO_BAY_SCAN_MONTHS }}
          QUERY_INTERVAL_MINUTES: ${{ vars.QUERY_INTERVAL_MINUTES }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          REPORT_PATH: state/run-report.json
          SUMMARY_PATH: state/run-summary.md
        run: python -m yosemite_monitor

      - name: Publish run summary
        if: always()
        run: |
          if [ -f state/run-summary.md ]; then
            cat state/run-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Camping Monitor" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run did not produce a summary file." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on log issue
        if: ${{ success() && vars.LOG_ISSUE_NUMBER != '' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const issueNumber = Number(process.env.LOG_ISSUE_NUMBER);
            const report = JSON.parse(fs.readFileSync('state/run-report.json', 'utf8'));
            if (!report.new_openings_count) {
              core.info('No new openings in this run. Skipping issue comment.');
              return;
            }
            const body = fs.readFileSync('state/run-summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
        env:
          LOG_ISSUE_NUMBER: ${{ vars.LOG_ISSUE_NUMBER }}

      - name: Commit updated state
        run: |
          if [ -z "$(git status --short -- state/notified-openings.json state/resolved-campgrounds.json)" ]; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notified-openings.json state/resolved-campgrounds.json
          git commit -m "Update camping monitor state [skip ci]"
          git push
